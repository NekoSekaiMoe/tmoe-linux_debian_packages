[tool.poetry]
name = "tmoe"
version = "2.0.0"
description = "TMOE - More Optional Environments for Linux containers and GUI desktops"
authors = ["2moe <2moe@github.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/2moe/tmoe"
repository = "https://github.com/2moe/tmoe"
documentation = "https://doc.tmoe.me"
keywords = ["linux", "container", "proot", "chroot", "android", "termux", "gui", "vnc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
packages = [{include = "tmoe"}]

[tool.poetry.dependencies]
python = "^3.10"
textual = "^0.52.0"
pydantic = "^2.5.0"
httpx = "^0.27.0"
rich = "^13.7.0"
typing-extensions = "^4.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-textual-snapshot = "^0.0.1"
mypy = "^1.8.0"
ruff = "^0.3.0"

[tool.poetry.scripts]
tmoe = "tmoe.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
